<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Noor Qur'an — Al-Qur'an lengkap, murottal, tafsir, kiblat, doa &amp; dzikir dalam satu aplikasi.">
  <meta name="theme-color" content="#0B3A30">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Noor Qur'an">
  <meta property="og:description" content="Al-Qur'an lengkap, murottal, tafsir, kiblat, doa &amp; dzikir dalam satu aplikasi.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Noor Qur'an">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Noor Qur'an</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0A2A24;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }
    /* Branded boot screen — removed once Flutter paints its first frame. */
    #boot {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(120% 90% at 50% 8%, #16A085 0%, #0E6E5C 42%, #0A2A24 100%);
      transition: opacity .5s ease;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot svg { width: 116px; height: 116px; animation: pop .9s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes pop { from { transform: scale(.5); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    #boot .name {
      margin-top: 22px; color: #fff; font-size: 27px; font-weight: 800; letter-spacing: -.7px;
      animation: rise .7s .25s ease-out both;
    }
    #boot .tag {
      margin-top: 6px; color: rgba(255,255,255,.68); font-size: 13px; font-weight: 500;
      animation: rise .7s .38s ease-out both;
    }
    @keyframes rise { from { transform: translateY(10px); opacity: 0 } to { transform: none; opacity: 1 } }
    #boot .bar {
      margin-top: 34px; width: 128px; height: 3px; border-radius: 3px;
      background: rgba(255,255,255,.16); overflow: hidden;
    }
    #boot .bar i {
      display: block; height: 100%; width: 42%; border-radius: 3px;
      background: linear-gradient(90deg, #E8CE86, #D4AF37);
      animation: slide 1.15s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-120%) } 100% { transform: translateX(320%) } }
  </style>
</head>
<body>
  <div id="boot">
    <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <path d="M60 10 L94 44 L60 78 L26 44 Z" stroke="#E8CE86" stroke-width="5.2" stroke-linejoin="round"/>
      <path d="M60 10 L94 44 L60 78 L26 44 Z" stroke="#E8CE86" stroke-width="5.2" stroke-linejoin="round" transform="rotate(45 60 44)"/>
      <path d="M58 26 a21 21 0 1 0 0 42 a16.5 16.5 0 1 1 0 -42 Z" fill="#E8CE86"/>
      <path d="M76 48 l2.7 6.4 6.9 .6 -5.2 4.5 1.6 6.8 -6 -3.6 -6 3.6 1.6 -6.8 -5.2 -4.5 6.9 -.6 Z" fill="#E8CE86"/>
    </svg>
    <div class="name">Noor Qur'an</div>
    <div class="tag">Cahaya Al-Qur'an dalam genggaman</div>
    <div class="bar"><i></i></div>
  </div>

  <script>
    // Dismiss the boot screen when Flutter paints (with a safety timeout).
    (function () {
      var done = false;
      function hide() {
        if (done) return; done = true;
        var b = document.getElementById('boot');
        if (b) { b.classList.add('hide'); setTimeout(function () { if (b) b.remove(); }, 600); }
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 12000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <!-- Android APK download banner: Android visitors only, dismissible, never
       covers the app (Flutter renders full-screen behind it). -->
  <style>
    #apk-banner {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 99999;
      display: none; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 18px;
      background: linear-gradient(135deg, #0B2A24 0%, #145C4A 100%);
      box-shadow: 0 12px 34px rgba(0,0,0,.4);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff; max-width: 520px; margin: 0 auto;
      border: 1px solid rgba(232,206,134,.22);
      animation: apkIn .4s cubic-bezier(.34,1.4,.64,1);
    }
    @keyframes apkIn { from { transform: translateY(26px); opacity: 0 } to { transform: none; opacity: 1 } }
    #apk-banner .ic {
      width: 38px; height: 38px; flex: 0 0 38px; border-radius: 12px;
      background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    #apk-banner .tx { flex: 1; min-width: 0 }
    #apk-banner .t1 { font-weight: 800; font-size: 14px; letter-spacing: -.2px }
    #apk-banner .t2 { font-size: 11.5px; opacity: .78; margin-top: 2px; line-height: 1.25 }
    #apk-banner a.btn {
      flex: 0 0 auto; text-decoration: none; color: #0B2A24;
      background: linear-gradient(135deg, #F3E3B0, #E8C766);
      font-weight: 800; font-size: 13.5px; padding: 11px 15px; border-radius: 12px; white-space: nowrap;
      min-height: 42px; display: inline-flex; align-items: center;
      box-shadow: 0 6px 16px rgba(232,199,102,.3);
    }
    #apk-banner button.x {
      flex: 0 0 auto; background: none; border: 0; color: rgba(255,255,255,.7);
      font-size: 22px; line-height: 1; cursor: pointer; padding: 6px; min-width: 34px; min-height: 34px;
    }
    @media (max-width: 400px) {
      #apk-banner .t2 { display: none; }
    }
  </style>
  <div id="apk-banner" role="dialog" aria-label="Unduh Noor Qur'an untuk Android">
    <div class="ic">📖</div>
    <div class="tx">
      <div class="t1">Noor Qur'an untuk Android</div>
      <div class="t2">Versi native — offline, lebih cepat &amp; hemat baterai</div>
    </div>
    <a class="btn" id="apk-dl" href="https://noor-quran-download.vercel.app/noor-quran.apk" rel="noopener">Unduh APK</a>
    <button class="x" id="apk-close" aria-label="Tutup">×</button>
  </div>
  <script>
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var dismissed = false;
        try { dismissed = localStorage.getItem('apkBannerDismissed') === '1'; } catch (e) {}
        if (isAndroid && !dismissed) {
          var b = document.getElementById('apk-banner');
          setTimeout(function () { b.style.display = 'flex'; }, 1400);
          document.getElementById('apk-close').onclick = function () {
            b.style.display = 'none';
            try { localStorage.setItem('apkBannerDismissed', '1'); } catch (e) {}
          };
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
