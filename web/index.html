<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Noor Qur'an — a complete, fluid Qur'an app with translations, tafsir, qiblah, duas, tasbih and a murottal player.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Noor Qur'an">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Noor Qur'an</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Android APK download banner: shown only to Android visitors, dismissible,
       and it never covers the app (Flutter renders full-screen behind it). -->
  <style>
    #apk-banner {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 99999;
      display: none; align-items: center; gap: 14px;
      padding: 16px 18px; border-radius: 18px;
      background: linear-gradient(135deg, #0B2A24 0%, #145C4A 100%);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff; max-width: 560px; margin: 0 auto;
      animation: apkIn .35s ease-out;
    }
    @keyframes apkIn { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }
    #apk-banner .ic {
      width: 46px; height: 46px; flex: 0 0 46px; border-radius: 13px;
      background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center;
      font-size: 25px;
    }
    #apk-banner .tx { flex: 1; min-width: 0 }
    #apk-banner .t1 { font-weight: 800; font-size: 16px; letter-spacing: -.2px }
    #apk-banner .t2 { font-size: 13px; opacity: .82; margin-top: 3px; line-height: 1.3 }
    #apk-banner a.btn {
      flex: 0 0 auto; text-decoration: none; color: #0B2A24; background: #E8C766;
      font-weight: 800; font-size: 15px; padding: 13px 18px; border-radius: 13px; white-space: nowrap;
      min-height: 48px; display: inline-flex; align-items: center;
    }
    #apk-banner button.x {
      flex: 0 0 auto; background: none; border: 0; color: rgba(255,255,255,.7);
      font-size: 26px; line-height: 1; cursor: pointer; padding: 8px; min-width: 44px; min-height: 44px;
    }
  </style>
  <div id="apk-banner" role="dialog" aria-label="Download Noor Qur'an for Android">
    <div class="ic">📖</div>
    <div class="tx">
      <div class="t1">Noor Qur'an untuk Android</div>
      <div class="t2">Versi native — offline, lebih cepat &amp; hemat baterai</div>
    </div>
    <a class="btn" id="apk-dl" href="/download/noor-quran-latest.apk" download>Unduh APK</a>
    <button class="x" id="apk-close" aria-label="Tutup">×</button>
  </div>
  <script>
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var dismissed = false;
        try { dismissed = localStorage.getItem('apkBannerDismissed') === '1'; } catch (e) {}
        if (isAndroid && !dismissed) {
          var b = document.getElementById('apk-banner');
          setTimeout(function () { b.style.display = 'flex'; }, 1200);
          document.getElementById('apk-close').onclick = function () {
            b.style.display = 'none';
            try { localStorage.setItem('apkBannerDismissed', '1'); } catch (e) {}
          };
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
