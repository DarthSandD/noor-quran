# This machine has 8 GB RAM total. The Flutter default (-Xmx8G + 4G metaspace = 12 GB)
# makes the Gradle daemon get OOM-killed mid-build ("the daemon has disappeared").
# Keep the heap comfortably inside physical memory.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
